<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Los Alamos Chess</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card h2 {
      margin-bottom: 1.5rem;
      color: #2c3e50;
    }

    .input-group {
      margin-bottom: 1.2rem;
      text-align: left;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 35px;
      cursor: pointer;
      font-size: 1.1rem;
      color: #444;
      user-select: none;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease-in-out;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error {
      color: red;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
      display: none;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: 0.3rem;
      color: #444;
    }

    .weak { color: red; }
    .medium { color: orange; }
    .strong { color: green; }

    .link {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .link a {
      color: #8e44ad;
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover {
      text-decoration: underline;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .modal-header {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      font-weight: bold;
      color: #2c3e50;
    }

    .modal-close {
      float: right;
      cursor: pointer;
      font-size: 1.2rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Reset Password</h2>
    <form id="emailForm">
      <div class="input-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" maxlength="50" required>
        <div class="error" id="emailError">Please enter a valid email.</div>
      </div>
      <button type="submit" class="btn">Send Code</button>
    </form>

    <!-- Hidden password reset form -->
    <form id="resetForm" style="display:none; margin-top:1.5rem;">
      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" maxlength="30" required>
        <span class="toggle-password" onclick="togglePassword('newPassword', this)">-</span>
        <div class="error" id="newPasswordError">Password is required.</div>
        <div class="password-strength" id="strengthText"></div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" maxlength="30" required>
        <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">-</span>
        <div class="error" id="confirmError">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn">Reset Password</button>
    </form>

    <div class="link">
      Remembered your password? <a href="login_page.html">Login here</a>
    </div>
  </div>

  <!-- OTP Modal -->
  <div id="otpModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <div class="modal-header">Enter Verification Code</div>
      <div class="input-group">
        <input type="text" id="code" maxlength="6" placeholder="6-digit code" required>
        <div class="error" id="codeError">Verification code is required.</div>
      </div>
      <button id="verifyCodeBtn" class="btn">Verify Code</button>
    </div>
  </div>

  <script>
    const emailForm = document.getElementById('emailForm');
    const resetForm = document.getElementById('resetForm');
    const otpModal = document.getElementById('otpModal');
    const closeModal = document.getElementById('closeModal');
    const verifyCodeBtn = document.getElementById('verifyCodeBtn');
    const newPasswordInput = document.getElementById('newPassword');
    const strengthText = document.getElementById('strengthText');

    // Toggle password visibility
    function togglePassword(id, el) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        el.textContent = "👁";
      } else {
        input.type = "password";
        el.textContent = "-";
      }
    }

    // Email form submission
    emailForm.addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('emailError').style.display = 'none';

      const email = document.getElementById('email').value.trim();
      if (!email.match(/^[^@\s]+@[^@\s]+\.[^@\s]+$/)) {
        document.getElementById('emailError').style.display = 'block';
        return;
      }

      // Simulate sending email
      setTimeout(() => {
        alert("📧 Verification code sent to your email!");
        otpModal.style.display = "flex";
      }, 500);
    });

    // OTP Modal close
    closeModal.addEventListener('click', () => {
      otpModal.style.display = "none";
    });
    window.addEventListener('click', (e) => {
      if (e.target === otpModal) otpModal.style.display = "none";
    });

    // Verify OTP
    verifyCodeBtn.addEventListener('click', () => {
      document.getElementById('codeError').style.display = 'none';
      const code = document.getElementById('code').value.trim();

      if (!code) {
        document.getElementById('codeError').style.display = 'block';
        return;
      }

      // Simulate code verification
      setTimeout(() => {
        alert("✅ Code verified!");
        otpModal.style.display = "none";
        emailForm.style.display = "none";
        resetForm.style.display = "block";
      }, 500);
    });

    // Password strength checker
    newPasswordInput.addEventListener('input', () => {
      const val = newPasswordInput.value;
      let strength = "Weak";
      let cls = "weak";

      if (val.length >= 8 && /[A-Z]/.test(val) && /\d/.test(val) && /[^A-Za-z0-9]/.test(val)) {
        strength = "Strong";
        cls = "strong";
      } else if (val.length >= 6 && (/[A-Z]/.test(val) || /\d/.test(val))) {
        strength = "Medium";
        cls = "medium";
      }

      strengthText.textContent = val ? `Strength: ${strength}` : "";
      strengthText.className = `password-strength ${cls}`;
    });

    // Reset form submission
    resetForm.addEventListener('submit', function(e) {
      e.preventDefault();
      document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

      const newPassword = newPasswordInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      let valid = true;

      if (!newPassword) {
        document.getElementById('newPasswordError').style.display = 'block';
        valid = false;
      }

      if (newPassword !== confirmPassword) {
        document.getElementById('confirmError').style.display = 'block';
        valid = false;
      }

      if (valid) {
        setTimeout(() => {
          alert("🎉 Password reset successful! (Ready to connect to backend API)");
        }, 600);
      }
    });
  </script>

</body>
</html>
