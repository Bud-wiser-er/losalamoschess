<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Los Alamos Chess</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #8e44ad); /* blue → purple ombre */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card h2 {
      margin-bottom: 1.5rem;
      color: #2c3e50;
    }

    .input-group {
      margin-bottom: 1.2rem;
      text-align: left;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 35px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #4facfe, #8e44ad);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease-in-out;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error {
      color: red;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
      display: none;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: 0.3rem;
      color: #444;
    }

    .weak { color: red; }
    .medium { color: orange; }
    .strong { color: green; }

    .link {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .link a {
      color: #8e44ad;
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Create Account</h2>
    <form id="registerForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
        <div class="error" id="usernameError">Username is required.</div>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <div class="error" id="emailError">Please enter a valid email.</div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
        <div class="error" id="passwordError">Password is required.</div>
        <div class="password-strength" id="strengthText"></div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required>
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
        <div class="error" id="confirmError">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn">Register</button>
    </form>

    <div class="link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const strengthText = document.getElementById('strengthText');

    // Toggle password visibility
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }

    // Password strength checker
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let strength = "Weak";
      let cls = "weak";

      if (val.length >= 8 && /[A-Z]/.test(val) && /\d/.test(val) && /[^A-Za-z0-9]/.test(val)) {
        strength = "Strong";
        cls = "strong";
      } else if (val.length >= 6 && (/[A-Z]/.test(val) || /\d/.test(val))) {
        strength = "Medium";
        cls = "medium";
      }

      strengthText.textContent = val ? `Strength: ${strength}` : "";
      strengthText.className = `password-strength ${cls}`;
    });

    // Validate and mock submit
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      let valid = true;

      if (!username) {
        document.getElementById('usernameError').style.display = 'block';
        valid = false;
      }

      if (!email.match(/^[^@\s]+@[^@\s]+\.[^@\s]+$/)) {
        document.getElementById('emailError').style.display = 'block';
        valid = false;
      }

      if (!password) {
        document.getElementById('passwordError').style.display = 'block';
        valid = false;
      }

      if (password !== confirmPassword) {
        document.getElementById('confirmError').style.display = 'block';
        valid = false;
      }

      if (valid) {
        // Simulated API call
        setTimeout(() => {
          alert("✅ Registration successful! (Ready to connect to backend API)");
          // Example future integration:
          /*
          fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          }).then(res => res.json()).then(data => {
            console.log(data);
          });
          */
        }, 600);
      }
    });
  </script>

</body>
</html>
